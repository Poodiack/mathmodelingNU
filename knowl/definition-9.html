<article class="definition definition-like"><h6 xmlns:svg="http://www.w3.org/2000/svg" class="heading">
<span class="type">Definition</span><span class="space"> </span><span class="codenumber">8.2.2</span><span class="period">.</span><span class="space"> </span><span class="title">Affine Discrete Dynamical System.</span>
</h6>
<p xmlns:svg="http://www.w3.org/2000/svg">An <dfn class="terminology">affine discrete dynamical system</dfn> is a sequence of numbers \(\{a_n\mid n = 0, 1, 2, \dots\}\) described by a relation of the form</p>
<div xmlns:svg="http://www.w3.org/2000/svg" class="displaymath">
\begin{equation*}
a_{n+1} = ba_n + m 
\end{equation*}
</div>
<p xmlns:svg="http://www.w3.org/2000/svg">where \(b\ne 0\text{.}\)</p></article><span class="incontext"><a href="long-term-behavior-dds.html#definition-9">in-context</a></span>
</body>

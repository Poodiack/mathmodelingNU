<body><article class="example example-like"><p xmlns:svg="http://www.w3.org/2000/svg">We can easily calculate the inverse of the matrix \(A=\begin{bmatrix} 1 &amp; 2 \\ 3 &amp; -4 
\end{bmatrix}\) using SageMath.</p>
<div class="sagecell-sage" id="sage-205"><script type="text/x-sage">A = matrix(2, 2, [1, 2, 3, -4])
A.inverse()
</script></div>
<p xmlns:svg="http://www.w3.org/2000/svg">We can confirm this is correct by verifying \(AA^{-1}=A^{-1}A=I_2\text{:}\)</p>
<div class="sagecell-sage" id="sage-206"><script type="text/x-sage">matrix([[2/5,1/5],[3/10,-1/10]]) * A
</script></div>
<div class="sagecell-sage" id="sage-207"><script type="text/x-sage">A * matrix([[2/5,1/5],[3/10,-1/10]])
</script></div></article></body>

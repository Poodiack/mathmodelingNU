<p xmlns:svg="http://www.w3.org/2000/svg">The solution of a linear dynamical system \(a_{n+1}=b a_n\) for \(b\ne 0\) is</p>
<div xmlns:svg="http://www.w3.org/2000/svg" class="displaymath">
\begin{equation}
a_n = b^n a_0\tag{8.1.1}
\end{equation}
</div>
<p xmlns:svg="http://www.w3.org/2000/svg">where \(a_0\) is the initial state.</p></article><article class="hiddenproof"><a class="proof-knowl original" data-knowl="./knowl/proof-2-hidden.html" title="Proof 8.1.3.1"><h6 xmlns:svg="http://www.w3.org/2000/svg" class="heading"><span class="type">Proof<span class="period">.</span></span></h6></a></article><span class="incontext"><a href="introduction-dds.html#lindynsolution">in-context</a></span>

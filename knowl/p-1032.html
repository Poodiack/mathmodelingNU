<p xmlns:svg="http://www.w3.org/2000/svg">The point is that if you want to estimate something with a simulation, you will get a more accurate estimate if you use many trials and take an average than if you use only a few trials. This concept is called the <dfn class="terminology">Law of Large Numbers.</dfn></p>

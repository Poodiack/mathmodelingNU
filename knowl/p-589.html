<p xmlns:svg="http://www.w3.org/2000/svg">To solve this system, we use techniques from <a href="linear-algebra-basics.html" class="internal" title="Section 7.1: Linear Algebra Basics">Section 7.1</a>. We can write this system in the form \(A\mathbf{x} = \mathbf{b}\) and try to calculate \(\mathbf{x} = A^{-1}\mathbf{b}\text{,}\) but it turns out the matrix \(A\) is not invertible.</p>

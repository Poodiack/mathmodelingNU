<p xmlns:svg="http://www.w3.org/2000/svg">A dynamical system is simply a system that changes over time.  The bacterial growth model from <a href="part-modeling-intro.html" class="internal" title="Part II: Mathematical Modeling">Part II</a> is one such example. When time is measured in discrete increments, as in the bacterial growth example, the system is called a discrete dynamical system.</p>

<p xmlns:svg="http://www.w3.org/2000/svg">Since the trajectories appear to be attracted to the origin, we have graphical evidence that the origin is an <dfn class="terminology">attracting equilibrium</dfn>. If the trajectories tended to go away from the origin, we would say the origin is a <dfn class="terminology">repelling equilibrium</dfn>.</p>
